name: Deploy closed Ernos Labs garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ernoslabs-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ernos Labs
        uses: actions/checkout@v4

      - name: Build and validate splash-only site
        run: python3 tools/build_closed_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the closed-garden splash
        uses: actions/upload-pages-artifact@v3
        with:
          path: _closed_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy closed-garden splash
        id: deployment
        uses: actions/deploy-pages@v4
