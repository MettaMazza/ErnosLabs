# Keep alternate deployments closed too; never publish the retained repo root.
[build]
  publish = "_closed_site"
  command = "python3 tools/build_closed_site.py"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Cross-Origin isolation for multi-threaded WASM (Kokoro TTS)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
