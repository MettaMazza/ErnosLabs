<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101e18">
  <meta name="description" content="Thank you for tending the Ernos Labs garden. We have closed, and the seeds are dormant. We hope we can continue again in the future.">
  <title>Ernos Labs — The garden is resting</title>
  <style>
    :root { color-scheme: dark; font-size: 100%; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem;
      background: radial-gradient(ellipse at 50% 0, #25392b 0, #14241c 42%, #101e18 78%);
      color: #f2eddf;
      font-family: Georgia, 'Times New Roman', serif;
    }
    main { width: min(100%, 49rem); text-align: center; }
    .name { margin: 0 0 3rem; color: #c1cead; font: 500 .875rem/1.5 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.2rem, 5.4vw, 4.6rem); font-weight: 400; line-height: 1.12; letter-spacing: -.025em; text-wrap: balance; }
    .rule { width: 3rem; height: 1px; background: #b7ac79; margin: 2.5rem auto; }
    .message { margin: 0 auto; max-width: 32rem; color: #d4d9c9; font-size: clamp(1.125rem, 2.2vw, 1.4rem); line-height: 1.8; text-wrap: balance; }
    .message + .message { margin-top: .75rem; }
    @media (max-width: 480px) { .name { margin-bottom: 2rem; } }
  </style>
</head>
<body>
  <main>
    <p class="name">Ernos Labs</p>
    <h1>Thank you for tending the Ernos Labs garden.</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">We have closed, and the seeds are dormant.</p>
    <p class="message">We hope we can continue again in the future.</p>
  </main>
</body>
</html>
